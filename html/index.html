<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PMA Portal - Choose Event Registration or Organizer Portal">
  <meta name="robots" content="noindex, nofollow">
  <title>PMA Score Portal</title>
  <link rel="icon" type="image/png" href="/images/PMA_Score_8.png">
  <link rel="stylesheet" href="/css/index.css">
</head>
<body>
  <div class="center-container">
    <h1 class="portal-title">PMA Score Portal</h1>

    <div class="form">
      <a id="eventRegistrationBtn" class="btn block-cube block-cube-hover" href="/registration">
        <div class="bg-top"><div class="bg-inner"></div></div>
        <div class="bg-right"><div class="bg-inner"></div></div>
        <div class="bg"><div class="bg-inner"></div></div>
        <div class="text">Event Registration</div>
      </a>
    </div>

    <div class="form">
      <a id="organizerPortalBtn" class="btn block-cube block-cube-hover" href="/login">
        <div class="bg-top"><div class="bg-inner"></div></div>
        <div class="bg-right"><div class="bg-inner"></div></div>
        <div class="bg"><div class="bg-inner"></div></div>
        <div class="text">Organizer Portal</div>
      </a>
    </div>

    <div class="form">
      <a id="returnPmaLink" class="btn btn-secondary block-cube block-cube-hover" href="https://performancema.herokuapp.com/ess">
        <div class="bg-top"><div class="bg-inner"></div></div>
        <div class="bg-right"><div class="bg-inner"></div></div>
        <div class="bg"><div class="bg-inner"></div></div>
        <div class="text">↩ Return to PMA</div>
      </a>
    </div>

    <div class="form">
      <button type="button" id="openPricingBtn" class="btn btn-secondary block-cube block-cube-hover">
        <div class="bg-top"><div class="bg-inner"></div></div>
        <div class="bg-right"><div class="bg-inner"></div></div>
        <div class="bg"><div class="bg-inner"></div></div>
        <div class="text">View Pricing</div>
      </button>
    </div>

    <div class="trust-footer" aria-label="Legal and security information">
      <p>Official PMA Score access portal. 
        By continuing, you agree to the <a href="/terms">Terms</a> 
        and <a href="/privacy">Privacy Policy</a>.</p>
    </div>
  </div>

  <div id="pricingOverlay" class="pricing-overlay" hidden>
    <div class="pricing-modal" role="dialog" aria-modal="true" aria-labelledby="pricingModalTitle">
      <button type="button" id="closePricingBtn" class="pricing-close-btn" aria-label="Close pricing">✕</button>
      <div class="pricing-lang-row">
        <label for="pricingLanguageSelect">Language:</label>
        <select id="pricingLanguageSelect" aria-label="Select pricing language">
          <option value="en">English</option>
          <option value="es">Espanol</option>
          <option value="fr">Francais</option>
          <option value="it">Italiano</option>
          <option value="ja">日本語</option>
          <option value="pl">Polski</option>
          <option value="nl">Nederlands</option>
          <option value="ms">Bahasa Melayu</option>
          <option value="ru">Русский</option>
        </select>
      </div>
      <h2 id="pricingModalTitle" class="pricing-visually-hidden">Pricing</h2>
      <div id="pricingContent" class="pricing-content"></div>
    </div>
  </div>

  <script src="/js/index.js" defer></script>
</body>
</html>
