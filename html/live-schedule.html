<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/images/PMA_Score_8.png">
  <title>Live Event Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/landing.css">
  <link rel="stylesheet" href="/css/division-advanced.css">
  <link rel="stylesheet" href="/css/live-schedule.css">
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      document.documentElement.classList.add(params.has('embed') ? 'live-tool' : 'live-viewer');
    }());
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="live-schedule-page">
  <main class="live-schedule-main">
    <header class="live-schedule-top">
      <div class="live-schedule-heading">
        <span class="live-schedule-label">live event schedule</span>
        <label class="live-inline-label live-event-select-label" id="liveEventSelectWrap" hidden for="liveScheduleSelect">
          <select id="liveScheduleSelect" class="da-select da-select-sm live-select-event" aria-label="Select saved schedule">
            <option value="">— choose a schedule —</option>
          </select>
        </label>
      </div>
    </header>

    <div id="liveToast" class="live-toast" hidden></div>

    <div id="liveContextMenu" class="live-context-menu" hidden>
      <button type="button" data-action="longer">Lengthen (+5 min)</button>
      <button type="button" data-action="shorter">Shorten (−5 min)</button>
    </div>

    <section id="livePickerPanel" class="live-panel" hidden>
      <p id="livePickerEmpty" class="live-hint" hidden>No saved schedules found. Create draws for an event first — a schedule is saved automatically — then choose it here.</p>
      <p id="livePickerError" class="live-error" hidden></p>
    </section>

    <section id="liveViewerPanel" class="live-panel live-panel-board" hidden>
      <div id="liveScheduleSettings" class="live-schedule-settings" hidden>
        <div class="live-settings-row">
          <div class="live-settings-group live-settings-day" id="liveDaySelectWrap">
            <div class="live-settings-day-controls">
              <label class="live-inline-label" for="liveDaySelect">Day
                <select id="liveDaySelect" class="da-select da-select-sm live-select-day"></select>
              </label>
              <div class="live-settings-stack">
                <button type="button" id="liveAddDayBtn" class="da-btn da-btn-sm">Add day</button>
                <button type="button" id="liveRemoveDayBtn" class="da-btn da-btn-sm">Remove day</button>
              </div>
            </div>
            <div id="liveDaysSettings" class="live-days-settings"></div>
          </div>

          <div class="live-settings-group">
            <label class="live-inline-label" for="liveRingCountInput">Rings
              <input type="number" id="liveRingCountInput" class="da-input da-input-sm live-settings-num" min="1" max="32" step="1" readonly tabindex="-1">
            </label>
            <div class="live-settings-stack">
              <button type="button" id="liveAddRingBtn" class="da-btn da-btn-sm">Add ring</button>
              <button type="button" id="liveRemoveRingBtn" class="da-btn da-btn-sm">Remove ring</button>
            </div>
          </div>

          <div class="live-settings-group live-settings-autofill">
            <button type="button" id="liveAutoFillBtn" class="da-btn da-btn-primary live-settings-btn-lg">Auto-fill</button>
          </div>

          <div class="live-settings-group live-settings-actions">
            <button type="button" id="liveSaveBtn" class="da-btn da-btn-primary live-settings-btn-lg" hidden>Save</button>
            <button type="button" id="liveDownloadQrBtn" class="da-btn da-btn-accent live-settings-btn-lg" hidden>Download QR code</button>
          </div>
        </div>
      </div>

      <div class="live-stage" id="liveStage">
        <div class="live-board-wrap" id="liveBoardDrop">
          <h1 id="liveViewerEventName" class="live-viewer-event-name" hidden></h1>
          <div id="liveBoard" class="da-schedule-board live-board"></div>
        </div>
        <div class="live-scratch" id="liveScratchDrop" hidden>
          <ul id="liveScratchList" class="live-scratch-list"></ul>
        </div>
      </div>
    </section>

    <section id="liveMissingPanel" class="live-panel" hidden>
      <h2>Schedule unavailable</h2>
      <p id="liveMissingMessage" class="live-hint">This live schedule link is invalid or no schedule has been saved yet.</p>
    </section>
  </main>

  <script type="module" src="/js/live-schedule.js"></script>
</body>
</html>
